<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iqra – কুরআন ও সুন্নাহ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iqra">
<meta name="theme-color" content="#FBF6E9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Hind+Siliguri:wght@400;600&family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6E9; --fg:#2B2A28; --muted:#6B675F; --card:#FFFDF6; --line:#E6DCC4; --accent:#1F6F5C; --accent-soft:#DCEFE7; --hl:#FFF0B8;
  --scale:1.15; --lh:1.9; --ls:0em; --ws:0em;
  --ui-font:'Lexend',system-ui,sans-serif; --bn-font:'Noto Sans Bengali',sans-serif; --ar-font:'Scheherazade New',serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--ui-font);font-size:calc(17px * var(--scale));line-height:1.5;letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-text-size-adjust:100%;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.bn{font-family:var(--bn-font)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--safe-top) + 10px) 16px 10px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.15em;margin:0;flex:1;font-weight:600;line-height:1.3}
header.top.reader{flex-wrap:wrap;row-gap:8px}
header.top.reader h1{order:5;flex-basis:100%}
header.top.reader #backBtn{margin-right:auto}
header.top h1 small{display:block;font-weight:400;font-size:.8em;color:var(--muted)}
.iconbtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:600;padding:0 12px}
main{padding:16px 16px calc(110px + var(--safe-bot));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-bot))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78em;color:var(--muted);min-height:56px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button .b{font-family:var(--bn-font);font-size:.92em}
nav.tabs{gap:2px}
nav.tabs button{font-size:.72em;line-height:1.2}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:1.1em;margin:22px 0 10px}
.btn{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* para list */
.paras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.para{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px}
.para .num{font-size:1.5em;font-weight:600;color:var(--accent);line-height:1.1}
.para .nm{font-size:.85em}
.para .dl{font-size:.75em;color:var(--muted)}
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border-color:var(--accent)}

/* reader */
.surah-head{text-align:center;margin:26px 0 16px;padding:16px;border-radius:18px;background:var(--accent-soft);border:2px solid var(--line)}
.surah-head .ar{font-family:var(--ar-font);font-size:1.8em;line-height:1.6}
.surah-head .en{font-weight:600}
.bism{font-family:var(--ar-font);font-size:calc(1.6em * var(--ar-mult,1));text-align:center;direction:rtl;margin:6px 0 18px;line-height:2}
.verse{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;scroll-margin-top:calc(90px + var(--safe-top));transition:opacity .2s}
.verse .ref{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.8em}
.verse .ar{font-family:var(--ar-font);direction:rtl;text-align:right;font-size:calc(1.75em * var(--ar-mult,1));line-height:2.1;margin:10px 0 6px;letter-spacing:0;word-spacing:normal}
.verse .tr{font-family:var(--bn-font);line-height:var(--lh);font-size:1.05em;text-align:left;margin-top:6px}
.verse .sajda{font-size:.75em;color:var(--accent);margin-left:8px}
.focus-on .verse{opacity:.28}
.focus-on .verse.is-focus{opacity:1;border-color:var(--accent);background:var(--hl);box-shadow:0 0 0 3px var(--accent-soft)}
.focusbar{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-bot));z-index:25;display:flex;justify-content:center;gap:10px;padding:8px;pointer-events:none}
.focusbar button{pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ruler{position:fixed;left:0;right:0;height:calc(5.5em * var(--scale));top:40%;pointer-events:none;z-index:15;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);box-shadow:0 0 0 100vmax rgba(20,20,20,.38)}
.loading{text-align:center;padding:40px 10px}
.spinner{width:42px;height:42px;border:5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* prayer */
.loc{display:flex;justify-content:space-between;align-items:center;gap:10px}
.loc .place{font-size:1.2em;font-weight:600}
.next{background:var(--accent);color:#fff;border-color:var(--accent)}
.next .label{opacity:.9;font-size:.9em}
.next .big{font-size:2em;font-weight:600;line-height:1.2}
.ptimes{list-style:none;margin:0;padding:0}
.ptimes li{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:2px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:10px;font-size:1.05em}
.ptimes li .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:1.15em}
.ptimes li.is-next{border-color:var(--accent);background:var(--accent-soft)}
.ptimes li.sun{opacity:.75;font-size:.95em}
.ptimes li .nm small{display:block;color:var(--muted);font-size:.8em}
table.week{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.85em;font-variant-numeric:tabular-nums}
table.week th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px}
table.week td{background:var(--card);padding:10px 6px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
table.week td:first-child{border-left:2px solid var(--line);border-radius:12px 0 0 12px;font-weight:600}
table.week td:last-child{border-right:2px solid var(--line);border-radius:0 12px 12px 0}
.weekwrap{overflow-x:auto}

/* forms */
label.f{display:block;margin:14px 0 6px;font-weight:600}
select,input[type=search],input[type=number]{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px}
input[type=range]{width:100%;height:40px;accent-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:58px;height:58px;border-radius:16px;border:3px solid var(--line);font-size:.7em;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.toggle input{width:28px;height:28px;accent-color:var(--accent)}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);min-height:48px;padding:6px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.preview{margin-top:10px}

/* hadith */
.verse .tx{line-height:var(--lh);margin-top:10px;white-space:pre-line}
.verse .tx.en{font-family:var(--ui-font)}
.verse .tx.bnt{font-family:var(--bn-font)}
.verse .lang{display:block;font-size:.72em;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:12px}
.books{list-style:none;margin:0;padding:0}
.books li button{width:100%;text-align:left;display:flex;gap:14px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:60px}
.bn-no{min-width:2.4em;height:2.4em;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center}
input.filter{margin-bottom:12px}
/* ramadan */
.rhero{background:var(--accent);color:#fff;border-color:var(--accent)}
.rhero .big{font-size:1.6em;font-weight:600;line-height:1.3}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.twin .card{margin:0;text-align:center}
.twin .t{font-size:1.7em;font-weight:600;font-variant-numeric:tabular-nums}
details.info{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:10px;padding:0 16px}
details.info summary{min-height:56px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none;padding:10px 0}
details.info summary::after{content:'+';margin-left:auto;font-size:1.4em;color:var(--accent)}
details.info[open] summary::after{content:'−'}
details.info p{margin:0 0 14px;line-height:var(--lh)}
details.info .bn{line-height:var(--lh)}
.linkbtns{display:flex;flex-direction:column;gap:10px}
.linkbtns .btn{text-align:left}
tr.today td{background:var(--accent-soft)}

/* brand */
.brandcard{display:flex;align-items:center;gap:16px;background:var(--accent-soft)}
.brandcard img{border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.18);flex:none}
.brandcard .bname{font-family:'Lexend',serif;font-size:1.9em;font-weight:600;color:var(--accent);line-height:1.1;letter-spacing:.03em}
/* surah list & benefits */
.qtabs{margin:12px 0}
.srow{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.srow .open{flex:1;text-align:left;display:flex;gap:14px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px;min-height:64px}
.srow .open small{display:block;color:var(--muted);font-size:.8em}
.srow .star{width:54px;border:2px solid var(--line);background:var(--card);border-radius:16px;font-size:1.4em;color:var(--accent)}
.star.on{background:var(--accent-soft)}
details.benefit{border-color:var(--accent);background:var(--hl)}
.bitem{border-top:2px dashed var(--line);padding-top:10px}
.bitem:first-of-type{border-top:0;padding-top:0}
.bitem p{margin:0 0 8px}
.bref{font-size:.82em;color:var(--muted)}
.bref a{color:var(--accent)}
.empty{text-align:center;padding:30px 10px}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + var(--safe-bot));border-top:3px solid var(--line)}
.sheet .grab{width:48px;height:6px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.citylist{list-style:none;margin:10px 0 0;padding:0}
.citylist li button{width:100%;text-align:left;border:0;border-bottom:2px solid var(--line);background:none;padding:14px 6px;min-height:52px}
.citylist li button b{font-weight:600}
.note{font-size:.85em;color:var(--muted);line-height:1.6}
.progress{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s}
</style>
</head>
<body>

<header class="top" id="topbar">
  <button class="iconbtn hidden" id="backBtn" aria-label="Back">‹ Back</button>
  <h1 id="title">Quran · <span class="bn">কুরআন</span><small id="subtitle" class="bn">৩০ পারা · আরবি ও বাংলা অনুবাদ</small></h1>
  <button class="iconbtn hidden" id="favBtn" aria-label="Favourite" title="Favourite">☆</button>
  <button class="iconbtn hidden" id="focusBtn" aria-label="Focus mode" title="Focus mode">Focus</button>
  <button class="iconbtn hidden" id="aaBtn" aria-label="Text settings">Aa</button>
</header>

<main id="view"></main>

<div class="focusbar hidden" id="focusbar">
  <button class="btn" id="prevV">↑ Previous</button>
  <button class="btn" id="nextV">Next ↓</button>
</div>
<div class="ruler hidden" id="ruler"></div>

<nav class="tabs" id="tabs">
  <button data-tab="quran" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V4.5"/><path d="M8 7h8M8 11h6"/></svg><span>Quran</span><span class="b">কুরআন</span></button>
  <button data-tab="hadith"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2"/><path d="M9 8h7M9 12h7M9 16h4"/></svg><span>Hadith</span><span class="b">হাদিস</span></button>
  <button data-tab="prayer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Prayer</span><span class="b">নামাজ</span></button>
  <button data-tab="ramadan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3l.6 1.4L19 5l-1.4.6L17 7l-.6-1.4L15 5l1.4-.6z"/></svg><span>Ramadan</span><span class="b">রমজান</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span><span class="b">সেটিংস</span></button>
</nav>

<script>
/*CALC-START*/
/* ---------- Prayer time calculation (based on the PrayTimes.org algorithm) ---------- */
const PT = (() => {
  const DR = Math.PI / 180;
  const dsin = d => Math.sin(d * DR), dcos = d => Math.cos(d * DR), dtan = d => Math.tan(d * DR);
  const darcsin = x => Math.asin(x) / DR, darccos = x => Math.acos(x) / DR;
  const darctan2 = (y, x) => Math.atan2(y, x) / DR, darccot = x => Math.atan(1 / x) / DR;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const diff = (a, b) => fix(b - a, 24);

  const METHODS = {
    MWL:      { name: 'Muslim World League', fajr: 18, isha: 17 },
    Karachi:  { name: 'Univ. of Islamic Sciences, Karachi', fajr: 18, isha: 18 },
    ISNA:     { name: 'ISNA (North America)', fajr: 15, isha: 15 },
    Egypt:    { name: 'Egyptian General Authority', fajr: 19.5, isha: 17.5 },
    Makkah:   { name: 'Umm al-Qura, Makkah', fajr: 18.5, ishaMin: 90, ramadanIshaMin: 120 },
    Dubai:    { name: 'Dubai (UAE)', fajr: 18.2, isha: 18.2 },
    Gulf:     { name: 'Gulf region', fajr: 19.5, ishaMin: 90 },
    Kuwait:   { name: 'Kuwait', fajr: 18, isha: 17.5 },
    Qatar:    { name: 'Qatar', fajr: 18, ishaMin: 90 },
    Singapore:{ name: 'Singapore / Malaysia / Indonesia', fajr: 20, isha: 18 },
    Turkey:   { name: 'Turkey (Diyanet)', fajr: 18, isha: 17 },
    Tehran:   { name: 'Tehran (Jafari)', fajr: 17.7, isha: 14, maghrib: 4.5 },
    Russia:   { name: 'Russia', fajr: 16, isha: 15 },
    France:   { name: 'France (UOIF 12°)', fajr: 12, isha: 12 },
  };

  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sunPos(jd) {
    const D = jd - 2451545.0;
    const g = fix(357.529 + 0.98560028 * D, 360);
    const q = fix(280.459 + 0.98564736 * D, 360);
    const L = fix(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
    const e = 23.439 - 0.00000036 * D;
    const RA = darctan2(dcos(e) * dsin(L), dcos(L)) / 15;
    return { decl: darcsin(dsin(e) * dsin(L)), eqt: q / 15 - fix(RA, 24) };
  }

  /* Returns prayer times as UTC hours relative to 00:00 UTC of the given local date. */
  function hours(y, m, d, lat, lng, opts) {
    const method = METHODS[opts.method] || METHODS.MWL;
    const asrFactor = opts.asr === 'Hanafi' ? 2 : 1;
    const jDate = julian(y, m, d) - lng / (15 * 24);
    const midDay = t => fix(12 - sunPos(jDate + t).eqt, 24);
    const sunAngleTime = (angle, t, ccw) => {
      const decl = sunPos(jDate + t).decl;
      const noon = midDay(t);
      const T = darccos((-dsin(angle) - dsin(decl) * dsin(lat)) / (dcos(decl) * dcos(lat))) / 15;
      return noon + (ccw ? -T : T);
    };
    const asrTime = (f, t) => {
      const decl = sunPos(jDate + t).decl;
      return sunAngleTime(-darccot(f + dtan(Math.abs(lat - decl))), t);
    };
    const RS = 0.833;
    let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, maghrib: 18, isha: 18 };
    for (let i = 0; i < 2; i++) {
      const p = k => (isFinite(t[k]) ? t[k] : ({ fajr: 5, isha: 18, maghrib: 18 })[k]) / 24;
      t = {
        fajr: sunAngleTime(method.fajr, p('fajr'), true),
        sunrise: sunAngleTime(RS, p('sunrise'), true),
        dhuhr: midDay(p('dhuhr')),
        asr: asrTime(asrFactor, p('asr')),
        sunset: sunAngleTime(RS, p('sunset')),
        maghrib: method.maghrib ? sunAngleTime(method.maghrib, p('maghrib')) : NaN,
        isha: method.isha ? sunAngleTime(method.isha, p('isha')) : NaN,
      };
    }
    // high-latitude adjustment
    const night = diff(t.sunset, t.sunrise);
    const rule = opts.highLat || 'AngleBased';
    const portion = angle => rule === 'NightMiddle' ? night / 2 : rule === 'OneSeventh' ? night / 7 : (angle / 60) * night;
    if (isNaN(t.fajr) || diff(t.fajr, t.sunrise) > portion(method.fajr)) t.fajr = t.sunrise - portion(method.fajr);
    if (method.isha && (isNaN(t.isha) || diff(t.sunset, t.isha) > portion(method.isha))) t.isha = t.sunset + portion(method.isha);
    if (method.maghrib && (isNaN(t.maghrib) || diff(t.sunset, t.maghrib) > portion(method.maghrib))) t.maghrib = t.sunset + portion(method.maghrib);
    if (!method.maghrib) t.maghrib = t.sunset;
    if (method.ishaMin) t.isha = t.maghrib + ((opts.ramadan && method.ramadanIshaMin) || method.ishaMin) / 60;
    const shift = -lng / 15;
    const out = {};
    for (const k of ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha']) out[k] = t[k] + shift;
    return out;
  }

  /* Calendar date (y,m,d) "today" in a given IANA time zone */
  function localYMD(tz, date = new Date()) {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
    const g = type => +parts.find(p => p.type === type).value;
    return { y: g('year'), m: g('month'), d: g('day') };
  }
  function isRamadan(date, tz) {
    try {
      const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { timeZone: tz, month: 'numeric' }).formatToParts(date);
      return +parts.find(p => p.type === 'month').value === 9;
    } catch (e) { return false; }
  }

  /* Prayer times as Date instants for the local date (y,m,d) at the place */
  function forDate(y, m, d, place, opts) {
    const noonUTC = new Date(Date.UTC(y, m - 1, d, 12));
    const h = hours(y, m, d, place.lat, place.lng, { ...opts, ramadan: isRamadan(noonUTC, place.tz) });
    const base = Date.UTC(y, m - 1, d);
    const res = {};
    for (const k in h) res[k] = isFinite(h[k]) ? new Date(Math.round((base + h[k] * 3600000) / 60000) * 60000) : null;
    return res;
  }
  return { METHODS, forDate, localYMD };
})();

/* ---------- offline store (IndexedDB) ---------- */
const DB = {
  p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise(res => {
      setTimeout(() => res(null), 2500); // never let storage problems block the app
      try {
        const r = indexedDB.open('quran-bangla', 2);
        r.onupgradeneeded = () => { const d = r.result; for (const n of ['juz', 'kv']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async run(store, mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { setTimeout(() => res(null), 2500); try { const q = fn(db.transaction(store, mode).objectStore(store)); q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  get(k, store = 'juz') { return this.run(store, 'readonly', s => s.get(k)); },
  set(k, v, store = 'juz') { return this.run(store, 'readwrite', s => s.put(v, k)); },
  async keys(store = 'juz') { return (await this.run(store, 'readonly', s => s.getAllKeys())) || []; },
};

/* ---------- Quran data (Al-Quran Cloud API) ---------- */
const API = 'https://api.alquran.cloud/v1/juz/';
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.code !== 200 || !j.data || !Array.isArray(j.data.ayahs)) throw new Error('Bad response');
  return j;
}
async function loadJuz(n) {
  const cached = await DB.get(n);
  if (cached && cached.verses && cached.verses.length) return cached;
  const [ar, bn] = await Promise.all([getJSON(API + n + '/quran-uthmani'), getJSON(API + n + '/bn.bengali')]);
  const bnMap = new Map(bn.data.ayahs.map(a => [a.number, a.text]));
  const surahs = {};
  const verses = ar.data.ayahs.map(a => {
    const s = a.surah || {};
    if (!surahs[s.number]) surahs[s.number] = { n: s.number, name: s.name, en: s.englishName, tr: s.englishNameTranslation, count: s.numberOfAyahs, type: s.revelationType };
    return { id: a.number, s: s.number, a: a.numberInSurah, ar: String(a.text || '').replace(/^﻿/, ''), bn: bnMap.get(a.number) || '', sajda: !!a.sajda };
  });
  const ed = bn.data.edition || {};
  const data = { n, verses, surahs, credit: [ed.englishName, ed.name].filter(Boolean).join(' · ') };
  await DB.set(n, data);
  return data;
}

/* Separate the Bismillah that the Uthmani text prefixes to verse 1 of each surah (except 1 and 9) */
const plain = s => s.replace(/[ً-ٰٟۖ-ۭـ]/g, '').replace(/[ٱآأإ]/g, 'ا');
function splitBism(v) {
  if (v.a !== 1 || v.s === 1 || v.s === 9) return [null, v.ar];
  const w = v.ar.split(/\s+/);
  if (w.length > 4 && plain(w[0]).startsWith('بسم') && plain(w[1]).includes('له')) return [w.slice(0, 4).join(' '), w.slice(4).join(' ')];
  return [null, v.ar];
}

/* Load one surah: from saved paras if available, otherwise from the API */
async function loadSurah(n) {
  const key = 'surah-' + n, m = SURAHS[n - 1];
  const cached = await DB.get(key, 'kv');
  if (cached && cached.verses && cached.verses.length) return cached;
  const j1 = juzFor(n, 1), j2 = juzFor(n, m.count);
  const parts = [];
  for (let j = j1; j <= j2; j++) parts.push(await DB.get(j));
  if (parts.every(Boolean)) {
    const verses = parts.flatMap(p => p.verses).filter(v => v.s === n);
    if (verses.length === m.count) return { surah: n, verses, surahs: { [n]: parts[0].surahs[n] || parts[parts.length - 1].surahs[n] }, credit: parts[0].credit };
  }
  const base = 'https://api.alquran.cloud/v1/surah/' + n + '/';
  const [ar, bn] = await Promise.all([getJSON(base + 'quran-uthmani'), getJSON(base + 'bn.bengali')]);
  const bnMap = new Map(bn.data.ayahs.map(a => [a.number, a.text]));
  const d = ar.data;
  const verses = d.ayahs.map(a => ({ id: a.number, s: n, a: a.numberInSurah, ar: String(a.text || '').replace(/^﻿/, ''), bn: bnMap.get(a.number) || '', sajda: !!a.sajda }));
  const ed = bn.data.edition || {};
  const data = { surah: n, verses, surahs: { [n]: { n, name: d.name, en: d.englishName, tr: d.englishNameTranslation, count: d.numberOfAyahs } }, credit: [ed.englishName, ed.name].filter(Boolean).join(' · ') };
  await DB.set(key, data, 'kv');
  return data;
}

/* ---------- Reader ---------- */
async function renderReader({ juz, surah, id, s: jumpS, a: jumpA }) {
  state.juz = juz || null; state.surah = surah || null;
  const sm = surah ? SURAHS[surah - 1] : null;
  if (surah) setTop({ title: `${surah}. ${esc(sm.en)}`, sub: `${sm.bn} · ${sm.count} আয়াত`, back: true, reader: true, fav: surah });
  else setTop({ title: `Para ${juz} · <span class="bn">পারা ${bnNum(juz)}</span>`, sub: JUZ[juz - 1], back: true, reader: true });
  const what = surah ? `Surah ${esc(sm.en)}…<br><span class="bn">${esc(sm.bn)} লোড হচ্ছে…</span>` : `Para ${juz}…<br><span class="bn">পারা ${bnNum(juz)} লোড হচ্ছে…</span>`;
  $('#view').innerHTML = `<div class="loading"><div class="spinner"></div>Loading ${what}</div>`;
  let data;
  try { data = surah ? await loadSurah(surah) : await loadJuz(juz); }
  catch (e) {
    $('#view').innerHTML = `<div class="card"><b>Could not load this Para.</b><p class="bn">পারাটি লোড করা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p><p class="note">Please check your internet connection. Once a Para has loaded once, it is saved and works offline.</p><button class="btn" id="retry">Try again · আবার চেষ্টা</button></div>`;
    $('#retry').onclick = () => renderReader({ juz, surah, id, s: jumpS, a: jumpA });
    return;
  }
  if (state.view !== 'reader' || (surah ? state.surah !== surah : state.juz !== juz)) return;
  state.data = data;
  let h = '', first = true;
  for (const v of data.verses) {
    if (v.a === 1 || first) {
      const s = data.surahs[v.s] || {};
      h += `<div class="surah-head"><div class="ar" lang="ar" dir="rtl">${esc(s.name || '')}</div><div class="en">${s.n}. ${esc(s.en || '')}</div><div class="muted">${esc(s.tr || '')} · ${s.count} ayahs${v.a !== 1 ? ' · continued from Ayah ' + v.a : ''}</div>${SURAHS[v.s - 1] ? `<div class="bn">${esc(SURAHS[v.s - 1].bn)}</div>` : ''}</div>`;
      if (v.a === 1) h += benefitsHTML(v.s);
    }
    first = false;
    const [bism, rest] = splitBism(v);
    if (bism && S.showAr) h += `<div class="bism" lang="ar">${esc(bism)}</div>`;
    h += `<article class="verse" id="v${v.id}" data-id="${v.id}" data-s="${v.s}" data-a="${v.a}">
      <span class="ref">${v.s}:${v.a}</span>${v.sajda ? '<span class="sajda">۩ Sajdah · সিজদা</span>' : ''}
      ${S.showAr ? `<div class="ar" lang="ar">${esc(rest)}</div>` : ''}
      ${S.showBn ? `<div class="tr" lang="bn">${esc(v.bn)}</div>` : ''}
    </article>`;
  }
  h += `<div class="card note">Arabic: Uthmani script. Bangla translation: ${esc(data.credit || 'bn.bengali')}. Text from the Al-Quran Cloud API (alquran.cloud).</div>`;
  if (surah) h += `<div class="row" style="justify-content:space-between">${surah > 1 ? `<button class="btn ghost" id="prevJ">‹ ${esc(SURAHS[surah - 2].en)}</button>` : '<span></span>'}${surah < 114 ? `<button class="btn" id="nextJ">${esc(SURAHS[surah].en)} ›</button>` : ''}</div>`;
  else h += `<div class="row" style="justify-content:space-between">${juz > 1 ? `<button class="btn ghost" id="prevJ">‹ Para ${juz - 1}</button>` : '<span></span>'}${juz < 30 ? `<button class="btn" id="nextJ">Para ${juz + 1} ›</button>` : ''}</div>`;
  $('#view').innerHTML = h;
  if ($('#prevJ')) $('#prevJ').onclick = () => go('reader', surah ? { surah: surah - 1 } : { juz: juz - 1 });
  if ($('#nextJ')) $('#nextJ').onclick = () => go('reader', surah ? { surah: surah + 1 } : { juz: juz + 1 });
  $('#view').querySelectorAll('.verse').forEach((el, i) => el.onclick = () => { if (state.focus) setFocus(i); });
  const target = jumpS ? $(`#view .verse[data-s="${jumpS}"][data-a="${jumpA}"]`) : (id && document.getElementById('v' + id));
  if (target) { target.scrollIntoView(); if (jumpS) { target.style.borderColor = 'var(--accent)'; target.style.background = 'var(--hl)'; } }
  // remember position
  const io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).map(e => e.target);
    if (!vis.length || state.focus) return;
    const el = vis[0];
    store.set('last', surah ? { surah, id: +el.dataset.id, s: +el.dataset.s, a: +el.dataset.a } : { juz, id: +el.dataset.id, s: +el.dataset.s, a: +el.dataset.a });
  }, { rootMargin: '-25% 0px -65% 0px' });
  $('#view').querySelectorAll('.verse').forEach(el => io.observe(el));
  state.observer = io;
}
function verses() { return [...$('#view').querySelectorAll('.verse')]; }
function setFocus(i) {
  const vs = verses(); if (!vs.length) return;
  state.focusIdx = Math.max(0, Math.min(vs.length - 1, i));
  vs.forEach((el, j) => el.classList.toggle('is-focus', j === state.focusIdx));
  const el = vs[state.focusIdx];
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (state.view === 'reader') store.set('last', state.surah ? { surah: state.surah, id: +el.dataset.id, s: +el.dataset.s, a: +el.dataset.a } : { juz: state.juz, id: +el.dataset.id, s: +el.dataset.s, a: +el.dataset.a });
}
function toggleFocus() {
  state.focus = !state.focus;
  $('#view').classList.toggle('focus-on', state.focus);
  $('#focusbar').classList.toggle('hidden', !state.focus);
  $('#focusBtn').style.background = state.focus ? 'var(--accent-soft)' : '';
  if (state.focus) {
    const vs = verses(), mid = window.innerHeight * 0.35;
    let idx = vs.findIndex(el => el.getBoundingClientRect().bottom > mid);
    setFocus(idx < 0 ? 0 : idx);
  }
}

function wireDisplay(root, onChange) {
  root.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { S.theme = b.dataset.theme; save(); applySettings(); root.querySelectorAll('[data-theme]').forEach(x => x.classList.toggle('on', x === b)); });
  root.querySelectorAll('input[type=range][data-k], select[data-k]').forEach(el => el.oninput = el.onchange = () => {
    S[el.dataset.k] = el.type === 'range' ? +el.value : el.value; save(); applySettings();
  });
  root.querySelectorAll('input[data-b]').forEach(el => el.onchange = () => {
    S[el.dataset.b] = el.checked; save(); applySettings();
    if (['showAr', 'showBn', 'showEn'].includes(el.dataset.b)) onChange && onChange(true);
  });
}
function openSheet(html, wire) {
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}<button class="btn" style="width:100%;margin-top:18px" data-close>Done · <span class="bn">ঠিক আছে</span></button></div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.onclick = e => { if (e.target === back) close(); };

  wire && wire(back.querySelector('.sheet'), close);

}

function addDays({ y, m, d }, n) { const t = new Date(Date.UTC(y, m - 1, d + n)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
let prayerTimer = null;

function renderPrayer() {
  setTop({ title: 'Prayer times · <span class="bn">নামাজের সময়</span>', sub: '' });
  const place = currentPlace(), o = opts(place), tz = place.tz;
  const today = PT.localYMD(tz);
  const times = PT.forDate(today.y, today.m, today.d, place, o);
  const tomorrow = addDays(today, 1);
  const tTimes = PT.forDate(tomorrow.y, tomorrow.m, tomorrow.d, place, o);
  const now = new Date();
  const five = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  let nextKey = five.find(k => times[k] && times[k] > now), nextTime = nextKey ? times[nextKey] : tTimes.fajr;
  const nextToday = !!nextKey;
  if (!nextKey) nextKey = 'fajr';
  const mins = Math.max(0, Math.round((nextTime - now) / 60000));
  const left = `${Math.floor(mins / 60)}h ${mins % 60}m`;
  const nk = PRAYERS.find(p => p[0] === nextKey);
  let dateStr = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: tz }).format(now);
  let hijri = '';
  try { hijri = new Intl.DateTimeFormat('en-GB-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric', timeZone: tz }).format(now); } catch (e) {}
  const week = [...Array(7)].map((_, i) => { const dd = addDays(today, i); return { dd, t: PT.forDate(dd.y, dd.m, dd.d, place, o) }; });
  const dayName = dd => new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(dd.y, dd.m - 1, dd.d, 12)));

  $('#view').innerHTML = `
  <div class="card loc"><div><div class="place">${esc(place.city)}</div><div class="muted">${esc(place.country)}</div></div>
    <button class="btn ghost" id="chg">Change · <span class="bn">বদলান</span></button></div>
  <div class="muted" style="margin:0 4px 12px">${esc(dateStr)}${hijri ? ' · ' + esc(hijri) : ''}</div>
  <div class="card next"><div class="label">Next prayer · <span class="bn">পরবর্তী নামাজ</span></div>
    <div class="big">${nk[1]} · <span class="bn">${nk[2]}</span></div>
    <div style="font-size:1.2em">${nextToday ? '' : 'Tomorrow · '}${fmt(nextTime, tz)} — in ${left}</div></div>
  <ul class="ptimes">${PRAYERS.map(([k, en, bn]) => `<li class="${k === 'sunrise' ? 'sun' : ''} ${nextToday && k === nextKey ? 'is-next' : ''}">
    <span class="nm"><b>${en}</b> · <span class="bn">${bn}</span>${k === 'sunrise' ? '<small>End of Fajr time · ফজরের শেষ সময়</small>' : ''}</span><span class="t">${fmt(times[k], tz)}</span></li>`).join('')}</ul>
  <h2>Next 7 days · <span class="bn">আগামী ৭ দিন</span></h2>
  <div class="weekwrap"><table class="week"><tr><th></th><th>Fajr</th><th>Sunrise</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th></tr>
  ${week.map(({ dd, t }) => `<tr><td>${dayName(dd)}</td>${PRAYERS.map(([k]) => `<td>${fmt(t[k], tz)}</td>`).join('')}</tr>`).join('')}</table></div>
  <h2>Calculation · <span class="bn">হিসাবের পদ্ধতি</span></h2>
  <div class="card">
    <label class="f" style="margin-top:0">Method</label>
    <select id="mth">${Object.entries(PT.METHODS).map(([k, m]) => `<option value="${k}" ${o.method === k ? 'selected' : ''}>${m.name}${k === place.method ? ' (default here)' : ''}</option>`).join('')}</select>
    <label class="f">Asr</label>
    <div class="seg" id="asrSeg"><button data-v="Standard" class="${o.asr === 'Standard' ? 'on' : ''}">Standard (Shafi'i)</button><button data-v="Hanafi" class="${o.asr === 'Hanafi' ? 'on' : ''}">Hanafi</button></div>
    <label class="f">High-latitude rule</label>
    <select id="hl">${[['AngleBased', 'Angle-based (recommended)'], ['OneSeventh', 'One-seventh of the night'], ['NightMiddle', 'Middle of the night']].map(([v, l]) => `<option value="${v}" ${S.highLat === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label class="f">Clock</label>
    <div class="seg" id="clk"><button data-v="12" class="${!S.h24 ? 'on' : ''}">12-hour</button><button data-v="24" class="${S.h24 ? 'on' : ''}">24-hour</button></div>
    <p class="note">Times are calculated from the sun's position, so they can differ by a few minutes from your local mosque's timetable. Please follow your mosque if it is different.<br><span class="bn">সময়গুলো হিসাব করে বের করা — স্থানীয় মসজিদের সময়সূচির সাথে কয়েক মিনিট পার্থক্য হতে পারে।</span></p>
  </div>`;
  $('#view').insertAdjacentHTML('beforeend', remindersCard('prayer'));
  wireReminders(place, o);
  $('#chg').onclick = openPlacePicker;
  $('#mth').onchange = e => { S.method = e.target.value === place.method ? null : e.target.value; save(); renderPrayer(); };
  $('#hl').onchange = e => { S.highLat = e.target.value; save(); renderPrayer(); };
  $('#asrSeg').querySelectorAll('button').forEach(b => b.onclick = () => { S.asr = b.dataset.v === place.asr ? null : b.dataset.v; save(); renderPrayer(); });
  $('#clk').querySelectorAll('button').forEach(b => b.onclick = () => { S.h24 = b.dataset.v === '24'; save(); renderPrayer(); });
  clearTimeout(prayerTimer);
  prayerTimer = setTimeout(function tick() { if (state.view !== 'prayer') return; if (document.querySelector('.sheet-back') || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#remCard'))) { prayerTimer = setTimeout(tick, 30000); return; } renderPrayer(); }, 30000);
}

function refreshPlaceView() { state.view === 'ramadan' ? renderRamadan() : renderPrayer(); }
function openPlacePicker() {
  const countries = new Set(PLACES.map(p => p.country)).size;
  openSheet(`
    <h2 style="margin-top:0">Choose location · <span class="bn">অবস্থান বেছে নিন</span></h2>
    <button class="btn" id="geo" style="width:100%">📍 Use my location · <span class="bn">আমার অবস্থান</span></button>
    <p class="note" id="geoMsg"></p>
    <input type="search" id="q" placeholder="Search country or city (${countries} countries)" autocomplete="off">
    <ul class="citylist" id="cl"></ul>`, (root, close) => {
    const list = root.querySelector('#cl'), q = root.querySelector('#q');
    const draw = () => {
      const s = q.value.trim().toLowerCase();
      const items = PLACES.filter(p => !s || p.country.toLowerCase().includes(s) || p.city.toLowerCase().includes(s));
      list.innerHTML = items.map(p => `<li><button data-id="${esc(p.id)}"><b>${esc(p.city)}</b> — ${esc(p.country)}</button></li>`).join('') || '<li class="muted" style="padding:14px">No match</li>';
      list.querySelectorAll('button').forEach(b => b.onclick = () => { S.placeId = b.dataset.id; S.custom = null; S.method = null; S.asr = null; save(); close(); refreshPlaceView(); });
    };
    q.oninput = draw; draw();
    root.querySelector('#geo').onclick = () => {
      const msg = root.querySelector('#geoMsg');
      if (!navigator.geolocation) { msg.textContent = 'Location is not available on this device.'; return; }
      msg.textContent = 'Finding your location…';
      navigator.geolocation.getCurrentPosition(pos => {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        // pick nearest listed place for sensible default method
        let best = PLACES[0], bd = 1e9;
        for (const p of PLACES) { const d = (p.lat - lat) ** 2 + ((p.lng - lng) * Math.cos(lat * Math.PI / 180)) ** 2; if (d < bd) { bd = d; best = p; } }
        S.custom = { id: 'custom', city: 'My location', country: `${lat.toFixed(3)}, ${lng.toFixed(3)} · near ${best.city}`, lat, lng, tz, method: best.method, asr: best.asr };
        S.method = null; S.asr = null; save(); close(); refreshPlaceView();
      }, () => { msg.textContent = 'Could not get your location. Please allow location access for this site in Settings, or pick a city below.'; }, { timeout: 15000 });
    };
  });
}

  <div class="card">
    <p style="margin-top:0"><b id="haveN">${have}</b> of 30 Paras saved on this device.<br><span class="bn">অফলাইনে পড়ার জন্য সব পারা ডাউনলোড করুন।</span></p>
    <button class="btn" id="dlAll">Download all 30 Paras</button>
    <div class="progress"><div id="bar" style="width:${have / 30 * 100}%"></div></div>
    <p class="note" id="dlMsg"></p>
  </div>
  <h2>Add to iPhone home screen</h2>
  <div class="card note">In Safari, tap the Share button, then <b>Add to Home Screen</b>. The app then opens full screen with its own icon.<br><span class="bn">Safari-তে Share বোতাম চাপুন, তারপর “Add to Home Screen” বেছে নিন।</span></div>
  <div class="card note">Arabic text: Uthmani script. Bangla translation and Arabic text are downloaded from the Al-Quran Cloud API (alquran.cloud). Prayer times are calculated on your device. Surah benefits use only authentic narrations (Bukhari, Muslim, or graded sahih/hasan), with references linked to sunnah.com. Sahih al-Bukhari (Arabic, English by Muhsin Khan, and Bangla) is downloaded from the open Hadith API by Fawaz Ahmed (github.com/fawazahmed0/hadith-api).</div>`;
  wireDisplay($('#view'));
  $('#dlAll').onclick = async () => {
    const btn = $('#dlAll'); btn.disabled = true;
    let ok = 0, fail = 0;
    for (let n = 1; n <= 30; n++) {
      $('#dlMsg').textContent = `Downloading Para ${n}…`;
      try { await loadJuz(n); ok++; } catch (e) { fail++; }
      const k = (await DB.keys()).length;
      $('#bar').style.width = (k / 30 * 100) + '%'; $('#haveN').textContent = k;
    }
    $('#dlMsg').textContent = fail ? `${fail} Para(s) failed — check your connection and tap again.` : 'All 30 Paras saved. You can now read offline. · সব পারা সংরক্ষিত হয়েছে।';
    btn.disabled = false;
  };
}

/* ---------- Reminders via the iPhone Calendar (.ics) ----------
   Calendar alerts ring even when the app is closed, with no server needed. */
function icsDate(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line) {
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 73) { out.push(cur); cur = ' '; bytes = 1; } cur += ch; bytes += b; }
  out.push(cur); return out.join('\r\n');
}
function buildICS(events) {
  const now = icsDate(new Date());
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Iqra//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Iqra'];
  events.forEach((e, i) => {
    L.push('BEGIN:VEVENT', `UID:pog-${e.start.getTime()}-${i}-${Math.random().toString(36).slice(2, 8)}@iqra-app`, `DTSTAMP:${now}`,
      `DTSTART:${icsDate(e.start)}`, `DTEND:${icsDate(new Date(e.start.getTime() + (e.mins || 10) * 60000))}`,
      `SUMMARY:${icsEsc(e.title)}`, `DESCRIPTION:${icsEsc(e.desc || '')}`);
    if (e.location) L.push(`LOCATION:${icsEsc(e.location)}`);
    if (e.rrule) L.push(`RRULE:${e.rrule}`);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(e.title)}`, `TRIGGER:-PT${e.before || 0}M`, 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function downloadICS(filename, events) {
  const blob = new Blob([buildICS(events)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}
const PRAYER_NAMES = { fajr: 'Fajr · ফজর', dhuhr: 'Dhuhr · যোহর', asr: 'Asr · আসর', maghrib: 'Maghrib · মাগরিব', isha: 'Isha · এশা' };
function prayerEvents(place, o, days, before, which) {
  const today = PT.localYMD(place.tz), ev = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(today, i), t = PT.forDate(d.y, d.m, d.d, place, o);
    for (const k of which) if (t[k] && t[k] > new Date()) ev.push({ start: t[k], title: `🕌 ${PRAYER_NAMES[k]}`, desc: `Prayer time in ${place.city} — Iqra`, location: `${place.city}, ${place.country}`, before });
  }
  return ev;
}
function ramadanEvents(place, o, R, before) {
  const ev = [];
  for (const x of R.days) {
    const d = x.date, t = PT.forDate(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), place, o);
    if (t.fajr && t.fajr > new Date()) ev.push({ start: t.fajr, title: '🌙 Sehri ends · সেহরির শেষ সময়', desc: `Stop eating by Fajr. ${place.city} — Iqra`, location: `${place.city}, ${place.country}`, before: Math.max(before, 30) });
    if (t.maghrib && t.maghrib > new Date()) ev.push({ start: t.maghrib, title: '🌅 Iftar · ইফতার', desc: `Time to open your fast. ${place.city} — Iqra`, location: `${place.city}, ${place.country}`, before });
  }
  return ev;
}
function kahfEvent(place, hour) {
  // next Friday at the chosen local hour, repeating weekly
  const today = PT.localYMD(place.tz);
  const dow = new Date(Date.UTC(today.y, today.m - 1, today.d)).getUTCDay();
  const d = addDays(today, (5 - dow + 7) % 7);
  // find the UTC instant for hour:00 local time on that date
  const guess = Date.UTC(d.y, d.m - 1, d.d, hour);
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: place.tz, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date(guess));
  const g = t => +p.find(x => x.type === t).value;
  const off = Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute')) - guess;
  return { start: new Date(guess - off), title: '📖 Read Surah Al-Kahf · সূরা কাহফ', desc: 'Friday reminder: a light between the two Fridays. Open Iqra → Quran → Al-Kahf.', rrule: 'FREQ=WEEKLY;BYDAY=FR', before: 0, mins: 30 };
}

function wireReminders(place, o) {
  const g = id => document.getElementById(id);
  g('rGo').onclick = () => {
    const before = +g('rB').value; let ev = [];
    if (g('rP') && g('rP').checked) ev = ev.concat(prayerEvents(place, o, +g('rD').value, before, ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha']));
    if (g('rR').checked) { const R = ramadanPeriod(PT.localYMD(place.tz)); if (R) ev = ev.concat(ramadanEvents(place, o, R, before)); }
    if (g('rK').checked) ev.push(kahfEvent(place, 10));
    if (!ev.length) { g('rMsg').textContent = 'Choose at least one reminder first.'; return; }
    downloadICS('iqra-reminders.ics', ev);
    g('rMsg').innerHTML = `${ev.length} reminders ready. If nothing opens, open this app in <b>Safari</b> and try again.`;
  };
}

async function getHadithSection(ed, n) {
  const r = await fetch(HAPI + ed + '/sections/' + n + '.json');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.hadiths)) throw new Error('Bad response');
  return j;
}
async function loadBook(n) {
  const key = 'bukhari-' + n;
  const cached = await DB.get(key, 'kv');
  if (cached && cached.items && cached.items.length) return cached;
  const res = await Promise.allSettled(['ara-bukhari', 'eng-bukhari', 'ben-bukhari'].map(ed => getHadithSection(ed, n)));
  const ok = res.map(r => r.status === 'fulfilled' ? r.value : null);
  if (!ok.some(Boolean)) throw new Error('Could not load');
  const maps = ok.map(j => new Map((j ? j.hadiths : []).map(h => [h.hadithnumber, String(h.text || '').trim()])));
  const order = [];
  const seen = new Set();
  for (const j of ok) if (j) for (const h of j.hadiths) if (!seen.has(h.hadithnumber)) { seen.add(h.hadithnumber); order.push(h); }
  order.sort((a, b) => a.hadithnumber - b.hadithnumber);
  const items = order.map(h => ({ n: h.hadithnumber, ref: h.reference || null, ar: maps[0].get(h.hadithnumber) || '', en: maps[1].get(h.hadithnumber) || '', bn: maps[2].get(h.hadithnumber) || '' }))
    .filter(h => h.ar || h.en || h.bn);
  const meta = (ok[1] || ok[0] || ok[2]).metadata || {};
  const sec = meta.section && typeof meta.section === 'object' ? Object.values(meta.section).filter(Boolean)[0] : '';
  const data = { n, title: sec || bookTitle(n), items, complete: ok.every(Boolean) };
  if (sec) { const t = store.get('bookTitles', {}); t[n] = sec; store.set('bookTitles', t); }
  if (data.complete) await DB.set(key, data, 'kv');
  return data;
}

      ${S.showAr && it.ar ? `<div class="ar" lang="ar" style="font-size:calc(1.45em * var(--ar-mult,1))">${esc(it.ar)}</div>` : ''}
      ${S.showEn && it.en ? `<span class="lang">ENGLISH</span><div class="tx en" lang="en">${esc(it.en)}</div>` : ''}

  h += `<div class="row" style="justify-content:space-between">${n > 1 ? `<button class="btn ghost" id="pb">‹ Book ${n - 1}</button>` : '<span></span>'}${n < BUKHARI_BOOKS.length ? `<button class="btn" id="nb">Book ${n + 1} ›</button>` : ''}</div>`;

  if ($('#pb')) $('#pb').onclick = () => go('book', { n: n - 1 });
  if ($('#nb')) $('#nb').onclick = () => go('book', { n: n + 1 });
}

/* ---------- Ramadan ---------- */
function hijriOf(date) {
  try {
    const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC' }).formatToParts(date);
    const g = t => parseInt(p.find(x => x.type === t).value, 10);
    return { d: g('day'), m: g('month'), y: g('year') };
  } catch (e) { return null; }
}
function ramadanPeriod(today) {
  const at = i => { const t = new Date(Date.UTC(today.y, today.m - 1, today.d + i, 12)); return { i, date: t, h: hijriOf(t) }; };
  if (!at(0).h) return null;
  let start = null;
  if (at(0).h.m === 9) { let i = 0; while (i > -31 && at(i - 1).h.m === 9) i--; start = at(i); }
  else for (let i = 1; i < 420; i++) { const x = at(i); if (x.h.m === 9) { start = x; break; } }
  if (!start) return null;
  const days = [];
  for (let i = start.i; i < start.i + 31; i++) { const x = at(i); if (x.h.m !== 9) break; days.push(x); }
  return { start, days, eid: at(start.i + days.length), year: start.h.y, inRamadan: at(0).h.m === 9 };
}

  if (R) { $('#view').querySelector('.linkbtns').insertAdjacentHTML('beforebegin', remindersCard('ramadan')); wireReminders(place, o); }
  if ($('#rchg')) $('#rchg').onclick = () => { openPlacePicker(); };
  $('#view').querySelectorAll('[data-go]').forEach(b => b.onclick = () => b.dataset.go === 'q' ? go('reader', { juz: +b.dataset.j, s: +b.dataset.s, a: +b.dataset.a }) : go('book', { n: +b.dataset.n }));
}

/* ---------- wiring ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#backBtn').onclick = () => go(state.view === 'book' ? 'hadith' : 'quran');
$('#focusBtn').onclick = toggleFocus;
$('#prevV').onclick = () => setFocus(state.focusIdx - 1);
$('#nextV').onclick = () => setFocus(state.focusIdx + 1);
$('#aaBtn').onclick = () => openSheet(displayControls(), root => wireDisplay(root, () => {
  if (state.view === 'book') { renderBook({ n: state.book }); return; }
  const l = store.get('last', null);
  if (state.surah) renderReader({ surah: state.surah, id: l && l.surah === state.surah ? l.id : null });
  else renderReader({ juz: state.juz, id: l && l.juz === state.juz ? l.id : null });
}));
const moveRuler = y => { const r = $('#ruler'); r.style.top = Math.max(60, y - r.offsetHeight / 2) + 'px'; };
window.addEventListener('touchmove', e => { if (S.ruler && state.view === 'reader') moveRuler(e.touches[0].clientY); }, { passive: true });
window.addEventListener('touchstart', e => { if (S.ruler && state.view === 'reader') moveRuler(e.touches[0].clientY); }, { passive: true });
window.addEventListener('mousemove', e => { if (S.ruler && state.view === 'reader') moveRuler(e.clientY); });

applySettings();
(function start() {
  const h = location.hash.slice(1);
  const m = h.match(/^para-(\d+)$/);
  if (m && +m[1] >= 1 && +m[1] <= 30) go('reader', { juz: +m[1] });
  else if (/^surah-\d+$/.test(h) && +h.split('-')[1] >= 1 && +h.split('-')[1] <= 114) go('reader', { surah: +h.split('-')[1] });
  else if (/^bukhari-\d+$/.test(h)) go('book', { n: +h.split('-')[1] });
  else if (['prayer', 'settings', 'hadith', 'ramadan'].includes(h)) go(h);
  else go('quran');
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
